name: test

on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"
      - name: Run tests
        run: |
          pnpm ci
          pnpm test
